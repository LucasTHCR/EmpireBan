name: EmpireBan
main: de.empireblocks.empireban.spigot.EmpireBanSpigot
version: '${project.version}'
api-version: '1.20'
author: empireblocks
description: Configurable ban/mute/kick system with escalating punishment IDs, IP handling, and VPN check.

commands:
  bansystem:
    aliases: [bansys]
    description: Manage the ban system.
    usage: /bansystem <reload|ids|logs>
  ban:
    description: Ban a player.
    usage: /ban <player> <ID|reason> [duration]
  unban:
    description: Unban a player.
    usage: /unban <player>
  mute:
    description: Mute a player.
    usage: /mute <player> <ID|reason> [duration]
  unmute:
    description: Unmute a player.
    usage: /unmute <player>
  kick:
    description: Kick a player.
    usage: /kick <player> [reason]
  check:
    description: Show a player's status.
    usage: /check <player>
  history:
    description: Show a player's punishment history.
    usage: /history <player>
  deletehistory:
    description: Delete a player's punishment history.
    usage: /deletehistory <player>

permissions:
  bansys.bansys:
    description: Grants access to /bansystem
    default: op
  bansys.reload:
    description: Allows reloading the configuration
    default: op
  bansys.ids.create:
    default: op
  bansys.ids.delete:
    default: op
  bansys.ids.addlvl:
    default: op
  bansys.ids.removelvl:
    default: op
  bansys.ids.setduration:
    default: op
  bansys.ids.settype:
    default: op
  bansys.ids.setonlyadmins:
    default: op
  bansys.ids.setreason:
    default: op
  bansys.ids.show:
    default: op
  bansys.logs.show:
    default: op
  bansys.logs.clear:
    default: op
  bansys.ban.all:
    description: Allows banning with any ID
    default: op
  bansys.ban.admin:
    description: Allows using admin-only IDs
    default: op
  bansys.unban:
    default: op
  bansys.unmute:
    default: op
  bansys.check:
    default: op
  bansys.history.show:
    default: op
  bansys.history.delete:
    default: op
  bansys.kick:
    default: op
  bansys.kick.admin:
    default: op
  bansys.notify:
    description: Receives staff notifications (e.g. alt account detected)
    default: op
  bansys.kick.bypass:
    default: false
  bansys.ban.bypass:
    default: false
  bansys.bypasschatfilter:
    default: op
  bansys.bypasschatdelay:
    default: op
