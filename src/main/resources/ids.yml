# Configurable ID system.
# Each ID has a default type, a reason, and any number of levels.
# Levels increment based on prior punishments under this ID:
# level 1 = first offense, level 2 = second, and so on. Once a player is already at
# the highest configured level, that level is applied again.
# Duration is in seconds, -1 = permanent.

ids:
  griefing:
    type: BAN
    only-admins: false
    reason: 'Griefing'
    levels:
      1:
        duration: 86400
        type: BAN
      2:
        duration: 604800
        type: BAN
      3:
        duration: -1
        type: BAN
  insults:
    type: MUTE
    only-admins: false
    reason: 'Insults / Toxic Behavior'
    levels:
      1:
        duration: 3600
        type: MUTE
      2:
        duration: 86400
        type: MUTE
      3:
        duration: 604800
        type: BAN
  advertising:
    type: BAN
    only-admins: false
    reason: 'Advertising'
    levels:
      1:
        duration: 259200
        type: BAN
      2:
        duration: -1
        type: BAN
  cheating:
    type: BAN
    only-admins: true
    reason: 'Banned Modifications (Cheats)'
    levels:
      1:
        duration: -1
        type: BAN
